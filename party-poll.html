<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clayton Horror House — Live Polls</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Nosifer&display=swap" rel="stylesheet">
<style>
:root {
  --blood: #8b0000;
  --deep-blood: #4a0000;
  --gore: #cc1100;
  --bone: #e8dcc8;
  --fog: #a0a090;
  --shadow: #0a0a0a;
  --gold: #c9a84c;
  --pie: #ff5fa8;
  --deep-pie: #5a1030;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #1a0505 0%, #050202 70%);
  color: var(--bone);
  font-family: 'Special Elite', serif;
  padding: 1.25rem 1rem 3rem;
}
h1 {
  font-family: 'Nosifer', cursive;
  font-size: 1.6rem;
  text-align: center;
  color: var(--gore);
  text-shadow: 0 0 18px #ff000055;
  margin: 0 0 0.25rem;
}
.sub {
  text-align: center;
  font-size: 0.78rem;
  color: var(--fog);
  margin: 0 0 1.5rem;
}

/* ===== POLL SWITCH ===== */
.poll-switch {
  display: flex;
  gap: 0.6rem;
  max-width: 480px;
  margin: 0 auto 1.5rem;
}
.poll-switch button {
  flex: 1;
  padding: 0.9rem 0.5rem;
  font-family: 'Creepster', cursive;
  font-size: 1.15rem;
  letter-spacing: 0.03em;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0.55;
  transition: all 0.2s;
}
#switch-costume {
  background: linear-gradient(145deg, #3a2e08, #1a1400);
  border: 2px solid var(--gold);
  color: var(--gold);
}
#switch-pied {
  background: linear-gradient(145deg, var(--deep-pie), #1a0210);
  border: 2px solid var(--pie);
  color: var(--pie);
}
.poll-switch button.active { opacity: 1; box-shadow: 0 0 20px currentColor; }

/* ===== PANELS ===== */
.poll-panel { display: none; max-width: 480px; margin: 0 auto; }
.poll-panel.active { display: block; }

.poll-panel.costume .panel-head { border-color: var(--gold); }
.poll-panel.pied .panel-head { border-color: var(--pie); }
.panel-head {
  text-align: center;
  border: 2px solid;
  border-radius: 8px;
  padding: 0.9rem;
  margin-bottom: 1rem;
}
.poll-panel.costume .panel-head { background: #2a220688; }
.poll-panel.pied .panel-head { background: #3a0a2288; }
.panel-head h2 {
  font-family: 'Creepster', cursive;
  font-size: 1.5rem;
  margin: 0 0 0.2rem;
}
.poll-panel.costume .panel-head h2 { color: var(--gold); }
.poll-panel.pied .panel-head h2 { color: var(--pie); }
.panel-head p { font-size: 0.78rem; color: var(--fog); margin: 0; }

.my-vote-banner {
  display: none;
  text-align: center;
  font-size: 0.78rem;
  padding: 0.5rem;
  border-radius: 6px;
  margin-bottom: 1rem;
}
.my-vote-banner.show { display: block; }
.poll-panel.costume .my-vote-banner { background: #3a2e0655; border: 1px solid var(--gold); color: var(--gold); }
.poll-panel.pied .my-vote-banner { background: #3a0a2255; border: 1px solid var(--pie); color: var(--pie); }

/* ===== NAME GRID ===== */
.name-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}
.name-btn {
  position: relative;
  padding: 0.7rem 0.4rem;
  background: #0a0505;
  border: 1px solid #3a2a2a;
  color: var(--bone);
  font-family: 'Special Elite', serif;
  font-size: 0.85rem;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
  overflow: hidden;
}
.name-btn .bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  z-index: 0;
  transition: width 0.4s ease;
}
.poll-panel.costume .name-btn .bar { background: linear-gradient(90deg, #3a2e0699, #5a4410aa); }
.poll-panel.pied .name-btn .bar { background: linear-gradient(90deg, #3a0a2299, #6a1040aa); }
.name-btn .label { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 0.3rem; }
.name-btn .count { opacity: 0.75; font-size: 0.72rem; }
.name-btn.mine { border-width: 2px; }
.poll-panel.costume .name-btn.mine { border-color: var(--gold); }
.poll-panel.pied .name-btn.mine { border-color: var(--pie); }
.name-btn.leader { border-color: var(--gore); }

.total-votes {
  text-align: center;
  font-size: 0.72rem;
  color: #555;
  margin-top: -0.75rem;
  margin-bottom: 1.5rem;
}

.status-line {
  text-align: center;
  font-size: 0.72rem;
  color: var(--fog);
  min-height: 1rem;
}
</style>
</head>
<body>

<h1>👻 Clayton Horror House</h1>
<p class="sub">Cast your vote below — results update live.</p>

<div class="poll-switch">
  <button id="switch-costume" class="active" onclick="showPoll('costume')">🏆 Best Costume</button>
  <button id="switch-pied" onclick="showPoll('pied')">🥧 Who Gets Pied</button>
</div>

<div class="poll-panel costume active" id="panel-costume">
  <div class="panel-head">
    <h2>🏆 Best Costume</h2>
    <p>Vote for the costume that impressed you most tonight.</p>
  </div>
  <div class="my-vote-banner" id="banner-costume"></div>
  <div class="name-grid" id="grid-costume"></div>
  <div class="total-votes" id="total-costume"></div>
</div>

<div class="poll-panel pied" id="panel-pied">
  <div class="panel-head">
    <h2>🥧 Who Gets Pied</h2>
    <p>Vote for who takes a pie to the face tonight. All in good fun!</p>
  </div>
  <div class="my-vote-banner" id="banner-pied"></div>
  <div class="name-grid" id="grid-pied"></div>
  <div class="total-votes" id="total-pied"></div>
</div>

<div class="status-line" id="status-line"></div>

<script>
// ===== GUEST LIST =====
const GUESTS = [
  "Dom","Amanda","Deakon","Vicky S","Vinnie","Shell","John","Simon",
  "Courtney","Zach","Paul B","Wendy","Annalisa","Kyla","Shashi","Beth",
  "Callum","Sam","James","Mike P","Sky","Helen","Paul S","Bev","Kim",
  "Kayleigh","Vicky C","Mike C","Ryan","Toni"
];

// ===== SHARED STORAGE (same JSONBin backend as the main app) =====
const EXTERNAL_STORAGE_CONFIG = {
  jsonbinId: '6a8b6b38f5f4af5e2939a895',
  jsonbinApiKey: '$2a$10$Qa/HJqtvzWMPayz1mkKUvu3TnblWXKPJurUsuuXmR1G4iw6qUAgEq'
};

function externalStorageConfigured(){
  return !!(EXTERNAL_STORAGE_CONFIG.jsonbinId && EXTERNAL_STORAGE_CONFIG.jsonbinApiKey);
}
function sharedBackend(){
  if(typeof window.storage !== 'undefined' && window.storage) return 'claude';
  if(externalStorageConfigured()) return 'jsonbin';
  return 'local';
}

let _jsonbinCache = null;
let _jsonbinCacheAt = 0;
const JSONBIN_CACHE_MS = 3000;

async function fetchWithTimeout(url, options, ms){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), ms || 10000);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch(e){
    if(e.name === 'AbortError') throw new Error('Request timed out after ' + (ms||10000) + 'ms');
    throw e;
  } finally {
    clearTimeout(id);
  }
}

async function jsonbinReadAll(force){
  if(!force && _jsonbinCache && (Date.now() - _jsonbinCacheAt < JSONBIN_CACHE_MS)) return _jsonbinCache;
  const res = await fetchWithTimeout('https://api.jsonbin.io/v3/b/' + EXTERNAL_STORAGE_CONFIG.jsonbinId + '/latest', {
    headers: { 'X-Master-Key': EXTERNAL_STORAGE_CONFIG.jsonbinApiKey, 'X-Bin-Meta': 'false' }
  });
  if(!res.ok) throw new Error('Read failed (' + res.status + ')');
  const data = await res.json();
  _jsonbinCache = (data && typeof data === 'object') ? data : {};
  _jsonbinCacheAt = Date.now();
  return _jsonbinCache;
}

async function jsonbinWriteAll(obj){
  const res = await fetchWithTimeout('https://api.jsonbin.io/v3/b/' + EXTERNAL_STORAGE_CONFIG.jsonbinId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': EXTERNAL_STORAGE_CONFIG.jsonbinApiKey },
    body: JSON.stringify(obj)
  });
  if(!res.ok) throw new Error('Write failed (' + res.status + ')');
  _jsonbinCache = obj;
  _jsonbinCacheAt = Date.now();
}

function _sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function jsonbinSetKey(key, value, maxAttempts){
  maxAttempts = maxAttempts || 5;
  let lastErr = null;
  for(let attempt = 1; attempt <= maxAttempts; attempt++){
    try {
      const all = await jsonbinReadAll(true);
      all[key] = value;
      await jsonbinWriteAll(all);
      const verify = await jsonbinReadAll(true);
      if(verify[key] === value) return { key, value };
      lastErr = new Error('Write was overwritten by a concurrent update');
    } catch(e){ lastErr = e; }
    if(attempt < maxAttempts) await _sleep(250 * attempt + Math.random() * 400);
  }
  throw lastErr || new Error('Could not save vote');
}

async function sharedGet(key){
  const backend = sharedBackend();
  if(backend === 'claude') return await window.storage.get(key, true);
  if(backend === 'jsonbin'){
    const all = await jsonbinReadAll();
    return Object.prototype.hasOwnProperty.call(all, key) ? { key, value: all[key] } : null;
  }
  const v = localStorage.getItem('chh_poll_' + key);
  return v ? { key, value: v } : null;
}

async function sharedSet(key, value){
  const backend = sharedBackend();
  if(backend === 'claude') return await window.storage.set(key, value, true);
  if(backend === 'jsonbin') return await jsonbinSetKey(key, value);
  localStorage.setItem('chh_poll_' + key, value);
  return { key, value };
}

// ===== DEVICE IDENTITY (so a phone can change its own vote) =====
function getDeviceId(){
  let id = localStorage.getItem('chh_poll_device_id');
  if(!id){
    id = 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('chh_poll_device_id', id);
  }
  return id;
}

// ===== POLL LOGIC =====
// Storage shape per poll: { votes: { "Name": count }, voters: { deviceId: "Name" } }
const POLLS = {
  costume: { key: 'poll_costume', gridId: 'grid-costume', bannerId: 'banner-costume', totalId: 'total-costume' },
  pied:    { key: 'poll_pied',    gridId: 'grid-pied',    bannerId: 'banner-pied',    totalId: 'total-pied' }
};
let pollTimers = {};

async function getPollData(pollId){
  const r = await sharedGet(POLLS[pollId].key);
  if(!r || !r.value) return { votes: {}, voters: {} };
  try { return JSON.parse(r.value); } catch(e){ return { votes: {}, voters: {} }; }
}

async function castVote(pollId, name){
  const deviceId = getDeviceId();
  const statusLine = document.getElementById('status-line');
  statusLine.textContent = 'Saving your vote...';
  try {
    const data = await getPollData(pollId);
    const prev = data.voters[deviceId];
    if(prev === name){
      // Tapping your current pick again does nothing — avoids accidental un-votes.
      statusLine.textContent = '';
      return;
    }
    if(prev && data.votes[prev]){
      data.votes[prev] = Math.max(0, data.votes[prev] - 1);
    }
    data.votes[name] = (data.votes[name] || 0) + 1;
    data.voters[deviceId] = name;
    await sharedSet(POLLS[pollId].key, JSON.stringify(data));
    statusLine.textContent = '';
    renderPoll(pollId, data);
  } catch(e){
    statusLine.textContent = '⚠ Could not save your vote — check your connection and try again.';
  }
}

function renderPoll(pollId, data){
  const p = POLLS[pollId];
  const grid = document.getElementById(p.gridId);
  const banner = document.getElementById(p.bannerId);
  const totalEl = document.getElementById(p.totalId);
  const deviceId = getDeviceId();
  const myVote = data.voters[deviceId];
  const votes = data.votes || {};
  const maxCount = Math.max(1, ...GUESTS.map(g => votes[g] || 0));
  const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);
  const leaderCount = Math.max(0, ...GUESTS.map(g => votes[g] || 0));

  grid.innerHTML = GUESTS.map((name, i) => {
    const count = votes[name] || 0;
    const pct = (count / maxCount) * 100;
    const isMine = myVote === name;
    const isLeader = leaderCount > 0 && count === leaderCount;
    return `<button class="name-btn${isMine ? ' mine' : ''}${isLeader ? ' leader' : ''}" onclick="castVote('${pollId}', ${JSON.stringify(name)})">
      <span class="bar" style="width:${pct}%"></span>
      <span class="label"><span>${name}${isMine ? ' ✓' : ''}</span><span class="count">${count}</span></span>
    </button>`;
  }).join('');

  if(myVote){
    banner.classList.add('show');
    banner.textContent = `You voted: ${myVote} — tap another name to change your vote.`;
  } else {
    banner.classList.remove('show');
  }
  totalEl.textContent = totalVotes + ' vote' + (totalVotes === 1 ? '' : 's') + ' so far';
}

async function refreshPoll(pollId){
  try {
    const data = await getPollData(pollId);
    renderPoll(pollId, data);
  } catch(e){
    // Quiet fail on background polling — don't spam the status line.
  }
}

function showPoll(pollId){
  document.querySelectorAll('.poll-panel').forEach(el => el.classList.remove('active'));
  document.getElementById('panel-' + pollId).classList.add('active');
  document.getElementById('switch-costume').classList.toggle('active', pollId === 'costume');
  document.getElementById('switch-pied').classList.toggle('active', pollId === 'pied');
  refreshPoll(pollId);
}

function init(){
  refreshPoll('costume');
  refreshPoll('pied');
  // Poll both in the background every few seconds so results feel live
  // even on the tab you're not currently looking at.
  setInterval(() => { refreshPoll('costume'); refreshPoll('pied'); }, 4000);
}

init();
</script>
</body>
</html>
